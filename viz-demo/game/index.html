<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One-Pad Beat Game</title><style>
body{background:#111;color:#eee;font-family:sans-serif;margin:16px}button{min-width:44px;min-height:44px;font-size:18px;margin:4px}
#pad{width:160px;height:160px;border-radius:50%;background:#2a6;border:none;color:#fff;font-size:22px;touch-action:manipulation}
#pad.flash{background:#6f9}canvas{background:#000;width:100%;max-width:800px;display:block}
@media (prefers-reduced-motion:reduce){#pad.flash{background:#2a6;outline:4px solid #fff}}
</style></head><body>
<h3>One-Pad Beat Game — 120 BPM synthesized loop, authored chart (2 loops, 16 s)</h3>
<button id="play">Play</button><button id="pause" disabled>Pause</button><button id="restart">Restart</button>
<label>Calibration (ms, + = you tap late): <input id="cal" type="number" value="0" step="5" style="width:70px;min-height:44px"></label>
<div id="hud" aria-live="polite">Score 0 | Perfect 0 Good 0 Miss 0 | <span id="last">-</span> | t=<span id="tm">0.000</span></div>
<canvas id="c" width="800" height="160"></canvas><br><button id="pad" aria-label="Tap pad">TAP / Space</button>
<script src="scoring.js"></script><script>
const R=window.Rhythm,LOOPS=2,END=LOOPS*R.LOOP_LEN,reduce=matchMedia('(prefers-reduced-motion: reduce)');
let ctx,t0,game,sched,nextBeat,state='idle';const $=id=>document.getElementById(id);
const songTime=()=>ctx?ctx.currentTime-t0:0;
function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.21)}
function hat(t){const b=ctx.createBuffer(1,2205,ctx.sampleRate),d=b.getChannelData(0);let s=12345;for(let i=0;i<d.length;i++){s=(s*16807)%2147483647;d[i]=(s/1073741823-1)*(1-i/d.length)}const n=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=7000;g.gain.value=.25;n.buffer=b;n.connect(f).connect(g).connect(ctx.destination);n.start(t)}
const BASS=[55,55,65.41,49];function bass(t,hz){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=hz;g.gain.setValueAtTime(.3,t);g.gain.linearRampToValueAtTime(0,t+R.BEAT*.9);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+R.BEAT)}
function schedule(){const ahead=songTime()+0.2;while(nextBeat*R.BEAT/2<Math.min(ahead,END)){const half=nextBeat,t=t0+half*R.BEAT/2,beatInLoop=(half/2)%16;
 if(R.CHART_BEATS.includes(beatInLoop))kick(t); hat(t); if(half%2===0)bass(t,BASS[Math.floor(beatInLoop/4)]); nextBeat++}}
function start(){if(!ctx)ctx=new AudioContext();ctx.resume();t0=ctx.currentTime+0.3;nextBeat=0;game=R.createGame(R.chart(LOOPS),+$('cal').value||0);
 clearInterval(sched);sched=setInterval(schedule,25);state='playing';ui();requestAnimationFrame(draw)}
function pause(){if(state!=='playing')return;ctx.suspend();state='paused';ui()}
function resume(){if(state!=='paused')return;ctx.resume();state='playing';ui();requestAnimationFrame(draw)}
function ui(){$('play').textContent=state==='paused'?'Resume':'Play';$('pause').disabled=state!=='playing';
 const c=game?game.counts:{perfect:0,good:0,miss:0};$('hud').firstChild.textContent=`Score ${game?game.score:0} | Perfect ${c.perfect} Good ${c.good} Miss ${c.miss} | `}
function tap(){if(state!=='playing')return;const r=game.tap(songTime());$('last').textContent=r.result+(r.dt!==undefined?` (${Math.round(r.dt*1000)}ms)`:'');ui();
 const p=$('pad');p.classList.add('flash');setTimeout(()=>p.classList.remove('flash'),reduce.matches?150:80)}
function draw(){if(state!=='playing')return;const t=songTime();if(game.update(t).length){$('last').textContent='miss';ui()}$('tm').textContent=t.toFixed(3);
 const g=$('c').getContext('2d');g.clearRect(0,0,800,160);g.fillStyle='#fff';g.fillRect(100,0,2,160);
 for(const n of game.notes){const x=100+(n.t-t)*(reduce.matches?150:300);if(x<-20||x>820)continue;g.fillStyle=n.hit==='miss'?'#a33':n.hit?'#3a3':'#fd4';g.beginPath();g.arc(x,80,14,0,7);g.fill()}
 if(t>END+0.3){state='done';clearInterval(sched);$('last').textContent='finished';ui();return}requestAnimationFrame(draw)}
$('play').onclick=()=>state==='paused'?resume():start();$('restart').onclick=()=>{if(ctx)ctx.resume();start()};$('pause').onclick=pause;
$('pad').addEventListener('pointerdown',e=>{e.preventDefault();tap()});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)tap()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
</script></body></html>
